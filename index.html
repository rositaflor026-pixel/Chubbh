<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Salto Pixel</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020;touch-action:none;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.hint{position:fixed;top:10px;left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:20px;background:#0008;color:#fff;font-size:12px;pointer-events:none}.btn{position:fixed;bottom:20px;width:74px;height:74px;border:2px solid #fff8;border-radius:50%;background:#111a;color:#fff;font-size:30px;font-weight:700;user-select:none;-webkit-user-select:none}.left{left:20px}.right{left:108px}.jump{right:24px;width:92px;height:92px;background:#f6b73c;color:#281b00;border-color:#fff}.again{position:fixed;left:50%;top:62%;transform:translate(-50%,-50%);padding:12px 22px;border:0;border-radius:12px;background:#f6b73c;color:#281b00;font-weight:800;font-size:18px;display:none}
</style></head><body><canvas id="game"></canvas><div class="hint">SALTO PIXEL · recoge monedas y llega a la bandera</div><button class="btn left">◀</button><button class="btn right">▶</button><button class="btn jump">▲</button><button class="again">JUGAR DE NUEVO</button>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,scale=1;function fit(){W=innerWidth;H=innerHeight;c.width=W;c.height=H}addEventListener('resize',fit);fit();
const keys={l:false,r:false,j:false};['left','right','jump'].forEach((n,i)=>{let b=document.querySelector('.'+n),k=['l','r','j'][i];['touchstart','mousedown'].forEach(e=>b.addEventListener(e,a=>{a.preventDefault();keys[k]=true;if(k==='j')jump()}));['touchend','mouseup','mouseleave'].forEach(e=>b.addEventListener(e,a=>{a.preventDefault();keys[k]=false}))});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.l=true;if(e.key==='ArrowRight'||e.key==='d')keys.r=true;if(e.key===' '||e.key==='ArrowUp'||e.key==='w')jump()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.l=false;if(e.key==='ArrowRight'||e.key==='d')keys.r=false});
const levelW=4200, ground=440;let p,cam,coins,enemies,blocks,state='play',score=0;function reset(){p={x:90,y:330,vx:0,vy:0,w:30,h:38,on:false,face:1};cam=0;score=0;state='play';document.querySelector('.again').style.display='none';coins=[320,520,760,1000,1300,1580,1880,2200,2500,2850,3150,3500,3820].map((x,i)=>({x,y:330-(i%3)*45,taken:false}));enemies=[{x:650,y:400,v:-1},{x:1180,y:400,v:1},{x:1750,y:400,v:-1},{x:2360,y:400,v:1},{x:3020,y:400,v:-1},{x:3420,y:400,v:1}];blocks=[...Array(42)].map((_,i)=>({x:i*100+450,y:380,w:70,h:60}));}reset();
function jump(){if(state==='play'&&p.on){p.vy=-11;p.on=false}}document.querySelector('.again').onclick=reset;
function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(){if(state!=='play')return;p.vx+=(keys.r?0.55:0)+(keys.l?-0.55:0);p.vx*=.86;p.vx=Math.max(-5,Math.min(5,p.vx));p.vy+=.55;p.x+=p.vx;p.y+=p.vy;p.on=false;if(p.y+p.h>=ground){p.y=ground-p.h;p.vy=0;p.on=true}for(const b of blocks){if(rect(p,b)&&p.vy>0&&p.y+p.h-p.vy<=b.y){p.y=b.y-p.h;p.vy=0;p.on=true}}p.x=Math.max(0,Math.min(levelW-p.w,p.x));for(const q of coins)if(!q.taken&&Math.hypot(q.x-p.x,q.y-p.y)<32){q.taken=true;score++}for(const e of enemies){e.x+=e.v*.9;if(e.x<0||e.x>levelW-40)e.v*=-1;if(rect(p,{x:e.x,y:e.y,w:32,h:32})){if(p.vy>1&&p.y+p.h<e.y+16){p.vy=-8;e.dead=true;score+=3}else if(!e.dead)state='dead'}}enemies=enemies.filter(e=>!e.dead);if(p.x>levelW-160)state='win';cam+=(p.x-W*.35-cam)*.12;cam=Math.max(0,Math.min(levelW-W,cam))}
function draw(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5cc8ff');g.addColorStop(1,'#d8f4ff');x.fillStyle=g;x.fillRect(0,0,W,H);x.save();x.translate(-cam,0);for(let i=0;i<levelW;i+=160){x.fillStyle='#8bd36b';x.fillRect(i,ground,160,18);x.fillStyle='#3e9a52';x.fillRect(i,ground+18,160,H-ground);}
for(let i=0;i<10;i++){let cx=(i*480+120)%levelW;x.fillStyle='#fff9';x.beginPath();x.arc(cx,110+(i%2)*55,28,0,7);x.arc(cx+28,110+(i%2)*55,36,0,7);x.arc(cx+62,110+(i%2)*55,25,0,7);x.fill()}
for(const b of blocks){x.fillStyle='#d58a39';x.fillRect(b.x,b.y,b.w,b.h);x.strokeStyle='#8a4d24';x.strokeRect(b.x,b.y,b.w,b.h)}for(const q of coins)if(!q.taken){x.fillStyle='#ffd34d';x.beginPath();x.arc(q.x,q.y,10,0,7);x.fill();x.fillStyle='#a66a00';x.fillRect(q.x-2,q.y-7,4,14)}for(const e of enemies){x.fillStyle='#7a3d2a';x.fillRect(e.x,e.y,32,32);x.fillStyle='#fff';x.fillRect(e.x+6,e.y+7,6,7);x.fillRect(e.x+20,e.y+7,6,7)}
// player
x.fillStyle='#263b8f';x.fillRect(p.x+5,p.y+14,20,24);x.fillStyle='#ffd1a1';x.fillRect(p.x+5,p.y,22,17);x.fillStyle='#f04b4b';x.fillRect(p.x+3,p.y-3,25,7);x.fillStyle='#172044';x.fillRect(p.x+(p.face>0?20:5),p.y+7,4,4);
// flag
x.fillStyle='#5b3a29';x.fillRect(levelW-100,220,8,220);x.fillStyle='#ff6d5a';x.beginPath();x.moveTo(levelW-92,225);x.lineTo(levelW-35,245);x.lineTo(levelW-92,265);x.fill();x.restore();x.fillStyle='#111';x.font='bold 18px system-ui';x.fillText('MONEDAS: '+score,18,34);if(state!=='play'){x.fillStyle='#000a';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';x.font='bold 42px system-ui';x.fillText(state==='win'?'¡NIVEL COMPLETADO!':'¡INTÉNTALO DE NUEVO!',W/2,H/2-30);x.font='18px system-ui';x.fillText('Monedas: '+score,W/2,H/2+8);x.textAlign='left';document.querySelector('.again').style.display='block'}}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script></body></html>
